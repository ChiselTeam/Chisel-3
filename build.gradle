import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.134'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'com.modrinth.minotaur' version '2.+'
}

var env = new Properties()
if (file('.env').exists()) {
    file('.env').withInputStream { env.load(it) }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        name 'Jitpack'
        url 'https://jitpack.io'
    }

    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url = 'https://maven.parchmentmc.org' }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    datagen {
        compileClasspath += sourceSets.main.output.classesDirs
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.datagen)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}Datagen" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }
    }

    runs {
        configureEach {
            loadedMods = [neoForge.mods."${mod_id}"]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientAuth {
            client()
            devLogin = true
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.datagen
            loadedMods = [neoForge.mods."${mod_id}Datagen"]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        loadedMods = [mods."${mod_id}"]
    }
}

// Ensure the IDE uses the same output directories as Gradle
// This can help with FML complaining about directories not being valid mod files
idea {
    module {
        inheritOutputDirs = true
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/.cache/**'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("maven.modrinth:ctmlib:${ctm_version}")
    implementation("maven.modrinth:jade:${jade_version}")

    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('check').configure {
    dependsOn tasks.named('datagenClasses')
}

tasks.register('generateLegacyMappings', JavaExec) {
    group = 'data generation'
    description = 'Builds Chisel migration tables from the reference mods in run/mods.'
    classpath = sourceSets.datagen.runtimeClasspath
    mainClass = 'io.github.chiselteam.chisel.datagen.migration.LegacyMigrationGenerator'
    args projectDir.absolutePath, providers.gradleProperty('legacyModsDir').getOrElse(file('run/mods').absolutePath)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description  : mod_description,
            ctm_version_range: ctm_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

apply from: 'gradle/incremental-resources.gradle'
apply from: 'gradle/optimize-textures.gradle'

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = env.getProperty("CURSEFORGE")
    def projectId = '225236'
    def mainFile = upload(projectId, jar)

    mainFile.changelog = file('CHANGELOG.md')
    mainFile.addModLoader("neoforge")
    mainFile.addGameVersion(minecraft_version)
    mainFile.releaseType = release_type
    mainFile.addRequirement("ctm-lib")
    mainFile.addGameVersion("Client", "Server")
}

modrinth {
    token = env.getProperty("MODRINTH")
    projectId = "chisel-3"
    versionName = "${mod_name}-${mod_version}"
    versionNumber = mod_version
    versionType = release_type
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    dependencies {
        required.project "ctmlib"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.register('releaseCurseForge') {
    group = 'upload'
    description = 'Builds and uploads the jar to CurseForge'
    dependsOn 'publishCurseForge'
}

tasks.register('releaseModrinth') {
    group = 'upload'
    description = 'Builds and uploads the jar to Modrinth'
    dependsOn 'modrinth'
}

tasks.register('release') {
    group = 'upload'
    description = 'Builds and uploads the jar to both CurseForge and Modrinth'
    dependsOn 'jar', 'releaseCurseForge', 'releaseModrinth'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xmaxerrs" << "10000"
}

tasks.withType(Jar).configureEach {
    zip64 = true
}

idea {
    module {
        inheritOutputDirs = true
        downloadSources = true
        downloadJavadoc = true
    }
}
